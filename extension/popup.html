<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>SCM Guide</title>
<link rel="stylesheet" href="css/app.css">
<style>
body{width:400px;max-height:560px;overflow-y:auto}
.pop{padding:14px}
.pop .brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pop .logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff}
.hit{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:7px;cursor:pointer}
.hit:hover{border-color:var(--acc)}
.hit b{font-size:13.5px}
.hit .m{font-size:12px;color:var(--mute)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.quick button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px;font-size:13px;display:flex;gap:8px;align-items:center}
.quick button:hover{border-color:var(--acc);color:var(--acc)}
.popfoot{display:flex;gap:8px;margin-top:10px}
.popfoot .btn{flex:1;justify-content:center;font-size:13px;padding:9px}
</style>
</head>
<body>
<div class="pop">
  <div class="brand">
    <span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></span>
    <div><b>SCM Guide</b><div style="font-size:11.5px;color:var(--mute)" id="popSub"></div></div>
    <div style="flex:1"></div>
    <button class="pill" id="popLang" style="padding:5px 9px"></button>
    <button class="pill" id="popTheme" style="padding:5px 9px"></button>
  </div>
  <div class="searchbig"><span id="sic"></span><input id="pq" placeholder="">
  </div>
  <div id="hits" style="margin-top:9px"></div>
  <div class="quick" id="quick"></div>
  <div class="popfoot">
    <button class="btn p" id="openFull"></button>
    <a class="btn g" id="siteLink" href="https://akiburrahman524-cyber.github.io/scm-guide/" target="_blank" rel="noopener noreferrer" style="text-decoration:none"></a>
  </div>
  <div class="footer-note" id="popDisc" style="margin-top:12px"></div>
</div>
<script src="js/shim.js"></script>
<script src="js/i18n.js"></script>
<script src="js/data/terms.js"></script>
<script src="js/data/hs.js"></script>
<script src="popup.js"></script>
</body>
</html>
